# Alembic 1.18 (digest target) — Postgres-only (ADR-0039 Reconsidered 2026-06-17).
# sqlalchemy.url is intentionally UNSET: migrations/env.py supplies it from NEURO_DATABASE_URL and
# refuses to guess a target (fail closed, ADR-0006). The full CI lane runs migrations-from-zero
# against a real postgres:18 every PR/main — that IS the migration test (phase0 Q14).
[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# Revision filenames: zero-padded ordinal + slug (e.g. 0001_initial_schema.py).
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
