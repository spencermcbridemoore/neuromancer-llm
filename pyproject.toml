[project]
name = "neuromancer-llm"
version = "0.0.1"
description = "LLM experimentation platform with mechanistic-interpretability capture, provenance, and export discipline."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Spencer McBride Moore" }]
keywords = ["interpretability", "llm", "provenance", "capture", "postgres"]

# Toolchain of record (phase1-digest item 8, verified June 2026): Postgres 18, SQLAlchemy 2.0,
# Alembic 1.18, typer CLI, psycopg, Azurite-only CI. Pins are installable lower bounds that PERMIT
# the digest's named versions; the committed uv.lock records the exact resolved set.
dependencies = [
    "sqlalchemy>=2.0",      # 2.0 declarative; Postgres-only (ADR-0039 Reconsidered 2026-06-17)
    "alembic>=1.13",        # digest target 1.18; migrations own the schema (never create_all)
    "psycopg[binary]>=3.1", # PG driver for SQLAlchemy 2.0 (postgresql+psycopg://)
    "typer>=0.12",          # the one `neuro` CLI (ADR-0038), thin delegates
    "azure-storage-blob>=12.19",  # storage backend + W1-W8 seam tests against Azurite (ADR-0040)
    "pyarrow>=14",          # per-token logprob/feature PARQUET shards in the lake (DuckDB-friendly); Stage-2 dep
]

[project.scripts]
neuro = "neuromancer_llm.cli.app:main"

[project.urls]
Homepage = "https://github.com/spencermcbridemoore/neuromancer-llm"

[dependency-groups]
# Installed by `uv sync` (default group). CI fast/full lanes use this group.
dev = [
    "pytest>=8",            # digest target 9; pinned to an installable lower bound
    "pytest-xdist>=3",      # parallel unit lane
    "ruff>=0.5",            # lint + format (replaces black/flake8)
    "pyright>=1.1.350",     # static type check, basic mode
    "testcontainers>=4",    # session-scoped postgres:18 fixture (golden + seam); reused CI service container otherwise
]

[tool.uv]
# This environment terminates TLS with a corporate CA; use the OS trust store so uv trusts it.
system-certs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuromancer_llm"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length governed by formatter, not lint

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E", "F401"]  # generated/structural migration files

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
reportMissingImports = true
# Resolve imports against the project venv (CI runs `uv run pyright`, which sets this automatically).
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Real detection hooks gate these; expected-skips golden (tests/test_markers_expected_skips.py)
# fails if the skip set drifts, so a marker can never SILENTLY skip the whole suite.
markers = [
    "pg: requires a real PostgreSQL 18 (testcontainers locally / service container in CI)",
    "seam: requires real Azurite AND PostgreSQL (W1-W8 bundle write-ordering kill-tests)",
    "gpu: requires a local GPU (skipped without one) -- Stage 2",
    "api: requires outbound API credentials (skipped without them) -- Stage 2",
    "network: requires outbound network (skipped when offline) -- Stage 2",
]
